[project]
name = "work-portal-server"
version = "0.1.0"
description = "个人工作门户 · 后端（模块化单体：门户外壳 + 各业务模块）"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",                       # 5.2 是 LTS，支持到 2028-04
    "djangorestframework>=3.16,<4.0",
    "djangorestframework-simplejwt>=5.5,<6.0",  # 替代已停更 9 年的 djangorestframework-jwt
    "drf-spectacular>=0.28,<1.0",            # 替代已弃用的 drf-yasg
    "django-cors-headers>=4.7,<5.0",
    "django-environ>=0.12,<1.0",             # 配置与密钥外置
]

[project.optional-dependencies]
# 生产环境依赖（Windows 本地开发不需要，gunicorn 只能在 Linux 运行）
prod = [
    "gunicorn>=23,<27",
]
# 考试模块依赖（迁移 apps/exam 时再启用）
exam = [
    "openpyxl>=3.1,<4.0",                    # 替代 xlrd（xlrd 2.0 起不支持 xlsx）
    "numpy>=2.0,<3.0",
    "scipy>=1.14",
    "catsim>=0.21,<1.0",
    "mysqlclient>=2.2",                      # 生产用 MySQL 时需要
]
# 开发工具
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

# ─────────────────────────────────────────────── 代码规范
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "RUF"]
ignore = [
    "E501",   # 行长由 formatter 控制
    "B008",   # Django 惯用法的函数调用默认值
    "DJ001",  # CharField 允许 null 的告警，迁移期暂不处理
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ─────────────────────────────────────────────── 测试
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps"]
